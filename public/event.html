<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Event Registration</title><link rel="stylesheet" href="/styles.css"><link href="https://assets.calendly.com/assets/external/widget.css" rel="stylesheet"><script src="https://assets.calendly.com/assets/external/widget.js" async></script></head>
<body><main class="form-shell"><section class="card"><div class="brand-mark">W</div><p class="eyebrow">WEST CAPITAL LENDING</p><div id="eventLoading">Loading event…</div>
<div id="eventContent" hidden><h1 id="eventName"></h1><div id="eventMeta" class="event-meta"></div><p id="eventDescription"></p>
<form id="registrationForm"><div class="form-grid">
<label>First Name<input name="firstName" required maxlength="80" autocomplete="given-name"></label>
<label>Last Name<input name="lastName" required maxlength="80" autocomplete="family-name"></label>
<label>NMLS ID<input name="nmlsId" required maxlength="40" inputmode="numeric"></label>
<label>Phone Number<input name="phone" type="tel" required maxlength="40" autocomplete="tel"></label>
<label class="full">Email<input name="email" type="email" required maxlength="150" autocomplete="email"></label>
<label class="full">Which West Capital team member invited you?<select id="recruiterId" name="recruiterId" required disabled><option value="">Loading team members…</option></select></label>
</div><button id="registerButton" class="button" type="submit" disabled>Register</button><p id="formMessage" class="message" aria-live="polite"></p></form></div>
<div id="eventError" class="error-panel" hidden></div>
<div id="calendlySection" hidden><hr class="section-rule"><p class="eyebrow">NEXT STEP</p><h2 id="calendlyTitle">Schedule a quick call</h2><p id="calendlyCopy">Choose a time below while you’re here.</p><div id="calendlyEmbed" class="calendly-inline-widget" style="min-width:320px;height:720px"></div><p id="calendlyStatus" class="message"></p></div></section></main>
<script>
const q=new URLSearchParams(location.search).get('slug')||'';const p=location.pathname.split('/').filter(Boolean);const slug=(q||(p[0]==='event'?p[1]||'':'')).trim();
const loading=document.getElementById('eventLoading'),content=document.getElementById('eventContent'),errorBox=document.getElementById('eventError'),form=document.getElementById('registrationForm'),message=document.getElementById('formMessage'),select=document.getElementById('recruiterId'),button=document.getElementById('registerButton');
async function getJson(url,options={}){const r=await fetch(url,options);let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||'The request could not be completed.');return d}
async function load(){if(!slug)throw new Error('This event link is missing an event name.');const [ed,rd]=await Promise.all([getJson(`/.netlify/functions/events?slug=${encodeURIComponent(slug)}`),getJson(`/.netlify/functions/referrers?slug=${encodeURIComponent(slug)}`)]);const e=ed.event;document.title=`${e.name} Registration`;document.getElementById('eventName').textContent=e.name;const prettyDate=e.date?new Date(`${e.date}T12:00:00`).toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'}):'';const prettyTime=v=>{if(!v)return'';const [h,m]=v.split(':').map(Number);return new Date(2000,0,1,h,m).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})};const times=[prettyTime(e.startTime||e.time),prettyTime(e.endTime)].filter(Boolean).join(' – ');document.getElementById('eventMeta').textContent=[prettyDate,times,e.location].filter(Boolean).join(' • ');document.getElementById('eventDescription').textContent=e.description||'';const rs=rd.recruiters||[];if(!rs.length)throw new Error('No West Capital team members have been assigned to this event yet.');select.innerHTML='<option value="">Select who invited you</option>'+rs.map(r=>`<option value="${r.id}">${r.name}</option>`).join('');select.disabled=false;button.disabled=false;loading.hidden=true;content.hidden=false}
let activeTracking=null;
async function trackCalendly(activity){if(!activeTracking)return;try{await fetch('/.netlify/functions/calendly-activity',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({...activeTracking,activity})})}catch{}}
function startCalendly(data,formValues){if(!data.calendly?.enabled)return;const section=document.getElementById('calendlySection'),embed=document.getElementById('calendlyEmbed');activeTracking={slug,registrationId:data.registration.id,trackingToken:data.trackingToken};section.hidden=false;document.getElementById('calendlyTitle').textContent=`Schedule a call with ${data.calendly.recruiterName}`;const u=new URL(data.calendly.url);u.searchParams.set('name',`${formValues.firstName} ${formValues.lastName}`.trim());u.searchParams.set('email',formValues.email);u.searchParams.set('utm_source','WCL Event Registration');u.searchParams.set('utm_campaign',slug);u.searchParams.set('utm_content',data.candidateId||'');const init=()=>{if(window.Calendly){Calendly.initInlineWidget({url:u.toString(),parentElement:embed});trackCalendly('shown');section.scrollIntoView({behavior:'smooth',block:'start'})}else setTimeout(init,150)};init()}
window.addEventListener('message',e=>{if(!activeTracking||!e.data?.event)return;if(e.data.event==='calendly.event_type_viewed')trackCalendly('event_type_viewed');if(e.data.event==='calendly.date_and_time_selected')trackCalendly('time_selected');if(e.data.event==='calendly.event_scheduled'){trackCalendly('scheduled');document.getElementById('calendlyStatus').className='message success';document.getElementById('calendlyStatus').textContent='Meeting scheduled — you’re all set!'}});
form.addEventListener('submit',async ev=>{ev.preventDefault();if(!form.reportValidity())return;message.className='message';message.textContent='Submitting…';button.disabled=true;const formValues=Object.fromEntries(new FormData(form).entries());try{const data=await getJson(`/.netlify/functions/registrations?slug=${encodeURIComponent(slug)}`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(formValues)});message.className='message success';message.textContent=`${data.message||'You’re registered!'}${data.candidateId?` Candidate ID: ${data.candidateId}`:''}`;startCalendly(data,formValues);form.reset()}catch(e){message.className='message error';message.textContent=e.message}finally{button.disabled=false}});
load().catch(e=>{loading.hidden=true;content.hidden=true;errorBox.hidden=false;errorBox.textContent=e.message});
</script></body></html>
