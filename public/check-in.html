<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Event check-in · West Capital</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6f9;color:#19354e;font:16px Arial,sans-serif}main{max-width:900px;margin:auto;padding:24px}header small{letter-spacing:2px;font-weight:bold}h1{margin:12px 0}p{line-height:1.5}#counts{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}.metric{flex:1;background:white;border:1px solid #dce4e9;border-radius:12px;padding:16px;min-width:120px}.metric strong{display:block;font-size:28px;margin-bottom:6px}label{display:block;font-weight:bold;margin-bottom:8px}input{width:100%;border:1px solid #b9c8d3;border-radius:8px;padding:16px;font:inherit}button{font:inherit;font-weight:bold;border:0;border-radius:8px;padding:13px 16px;background:#19354e;color:white;cursor:pointer}button.secondary{background:#eaf0f5;color:#19354e}button:disabled{opacity:.6;cursor:wait}#tools{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:12px 0}article{background:white;padding:18px;border:1px solid #dce4e9;border-radius:12px;margin:14px 0}article h2{font-size:19px;margin:0 0 5px}.person{display:flex;justify-content:space-between;align-items:center;gap:16px;border-top:1px solid #e3e9ee;padding-top:14px;margin-top:14px}.person small{display:block;margin-top:5px;color:#627787}.done{color:#137452;font-weight:bold}#message{min-height:24px}#results:empty{display:none}@media(max-width:520px){main{padding:18px}.person{align-items:flex-start}.person button{max-width:135px}}
</style></head><body><main><header><small>WEST CAPITAL LENDING · EVENT STAFF</small><h1 id="title">Event check-in</h1><p id="eventDetails"></p></header><div id="counts" aria-live="polite"></div><label for="search">Find an attendee or plus-one</label><input id="search" type="search" placeholder="Search first or last name…" autocomplete="off"><div id="tools"><span id="matchCount"></span><button id="refresh" class="secondary">Refresh</button></div><p id="message" role="status"></p><div id="results"></div><p>Check in each person when they arrive. Share this private link only with event staff.</p></main><script>
(()=>{
const $=id=>document.getElementById(id),slug=new URLSearchParams(location.search).get('event')||'',storageKey='checkin-code:'+slug;
let token=location.hash.slice(1)||sessionStorage.getItem(storageKey)||'',generation=0,timer,busy=false;
if(token){sessionStorage.setItem(storageKey,token);history.replaceState(null,'',location.pathname+location.search);}
const endpoint='/.netlify/functions/check-in?slug='+encodeURIComponent(slug);
const node=(tag,text)=>{const element=document.createElement(tag);if(text!==undefined)element.textContent=text;return element};
async function request(options={}){const response=await fetch(endpoint+(options.method?'':'&q='+encodeURIComponent($('search').value)),{...options,headers:{'x-checkin-code':token,'content-type':'application/json'},cache:'no-store',signal:AbortSignal.timeout(30000)});const data=await response.json().catch(()=>({error:'The server timed out. Refresh to verify check-in status.'}));if(!response.ok||data.error)throw Error(data.error||'Request failed.');return data;}
function person(row,kind,name,at){const line=node('div');line.className='person';const info=node('div'),label=node('strong',name);info.append(label,node('small',kind==='guest'?'Plus-one for '+row.name:'Registered attendee'));if(at){const status=node('small','Checked in · '+new Date(at).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}));status.className='done';info.append(status);}const button=node('button',at?'Undo check-in':'Check in');button.className=at?'secondary':'';button.onclick=async()=>{if(busy)return;if(at&&!confirm('Undo check-in for '+name+'?'))return;busy=true;generation++;button.disabled=true;try{await request({method:'POST',body:JSON.stringify({id:row.id,person:kind,checked:!at})});busy=false;await load();}catch(error){$('message').textContent=error.message;button.disabled=false;}finally{busy=false;}};line.append(info,button);return line;}
async function load(){if(busy)return;const current=++generation;$('message').textContent='Loading attendance…';try{const data=await request();if(current!==generation)return;$('title').textContent=data.event.name;$('eventDetails').textContent=[data.event.date,data.event.location].filter(Boolean).join(' · ');$('counts').replaceChildren(...[['Registered people',data.total],['Checked in',data.checked],['Still expected',data.remaining]].map(([label,value])=>{const box=node('div');box.className='metric';box.append(node('strong',String(value)),node('span',label));return box;}));$('matchCount').textContent=data.matched>50?'Showing 50 of '+data.matched+' matches. Narrow your search.':data.matched+' matching registration'+(data.matched===1?'':'s');$('results').replaceChildren(...data.rows.map(row=>{const card=node('article');card.append(node('h2',row.name));if(row.phoneLast4)card.append(node('small','Phone ending '+row.phoneLast4));card.append(person(row,'attendee',row.name,row.attendeeAt));if(row.guest)card.append(person(row,'guest',row.guest,row.guestAt));return card;}));$('message').textContent=data.rows.length?'Attendance updated.':'No matching attendees.';}catch(error){if(current===generation)$('message').textContent=error.message;}}
$('search').oninput=()=>{generation++;clearTimeout(timer);timer=setTimeout(load,250);};$('refresh').onclick=load;if(token&&slug){load();setInterval(()=>{if(!document.hidden&&!busy)load();},30000);}else{$('message').textContent='Open the private check-in link provided by the event organizer.';$('refresh').disabled=true;$('search').disabled=true;}
})();
</script></body></html>
